name: Inventory_Infrastructure

services:

  endpoint:
    container_name: endpoint
    build: ./Endpoint
    networks:
      - front_network


  database:
    container_name: database
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: temporaryadmin
      POSTGRES_PASSWORD: temporarypassword
      POSTGRES_DB: inventory_db
    volumes:
      - ./Database/data:/var/lib/postgresql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - back_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporaryadmin -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapi:
    container_name: webapi
    build: ./WebAPI
    networks:
      - back_network
    ports:
      - "9001:9001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f 127.0.0.1:9001/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  webserver:
    container_name: webserver
    build: ./WebServer
    ports:
      - "8080:80"
    networks:
      - front_network
      - back_network
    depends_on:
      webapi:
        condition: service_healthy


networks:
  back_network:
    ipam:
      config:
        - subnet: 10.64.0.0/24
          gateway: 10.64.0.1
          aux_addresses:
            webapi: 10.64.0.4
            database: 10.64.0.5

  front_network:
    ipam:
      config:
        - subnet: 10.66.0.0/24
          gateway: 10.66.0.1
          aux_addresses:
            endpoint: 10.66.0.2
            webserver: 10.66.0.3
