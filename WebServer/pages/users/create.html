<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
</head>

<body>

    <a href="/">← Back</a>

    <h1>Create User</h1>

    <form id="create_user_form">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>

        <label for="access_level">Access Level ID:</label>
        <input
            type="number"
            id="access_level"
            name="access_level"
            required
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">Create User</button>

    </form>

    <p id="result"></p>

    <script src="/users/users.js"></script>

</body>
</html>
